# Publish this repository's products: fetch with the site's pipelines,
# validate against the site's contract, and publish one build to GitHub Pages
# and to Cloudflare R2. Generated 2026-09-27 from the sibling data
# repositories' workflow (mercator-model-fields-repo's, less its tile caches).
#
# **Scheduled since 2026-09-27**, after the dispatched run 36296054871 published
# a tree (build, Pages and R2 all green) — the ritual that turned
# Sentinel-3's schedule on: prove the pipeline, then turn the schedule on.
#
# Needs, from the owner: `PIPELINES_SSH_KEY` (this repository's read-only
# deploy key on oceansensing.github.io) and the organization's three R2_*
# secrets.

name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the probe says the tree is current'
        type: boolean
        default: false
  schedule:
    - cron: '7 1,7,13,19 * * *'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      behind: ${{ steps.run.outputs.behind }}
    steps:
      # This repository first: actions/checkout cleans its destination, so
      # taking the root after the others would wipe them.
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the pipelines
        id: pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Say why the pipelines could not be checked out
        if: failure() && steps.pipelines.outcome == 'failure'
        run: |
          echo "::error title=Cannot read the pipelines::Could not check out oceansensing/oceansensing.github.io. Read the step log first - the causes look alike."
          echo "::error title=If the log says 'error in libcrypto'::The key could not be PARSED - almost always a missing trailing newline on PIPELINES_SSH_KEY. Re-paste the whole file (pbcopy < keyfile), or set it with gh secret set < keyfile."
          echo "::error title=If the log says only 'Permission denied (publickey)'::The public half is missing from the site repository's Deploy keys page, was revoked, or does not match."
          echo "::error title=If the log says 'Repository not found'::The secret is unset or empty, so the checkout fell back to GITHUB_TOKEN, which holds no grant on the site repository."
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install what the fetcher needs
        run: pip install --no-cache-dir numpy
      - name: Unit-test the orchestrator
        working-directory: site
        run: python3 pipeline/test_orchestrate.py
      - name: Self-test fetch-cbefs.py
        run: python3 site/scripts/fetch-cbefs.py --self-test
      - name: Seed the stage from the last publish
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py seed
      - name: Plan the run
        id: plan
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py plan --mode full
      - name: Fetch, validate, assemble
        id: run
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py run
      - name: Upload the site
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
      - name: Upload the branch content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-out
          path: branch-out
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the branch content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-out
          path: branch-out
      - name: Publish the branch
        run: |
          cd branch-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:published
      - name: Configure Pages
        if: needs.build.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        if: needs.build.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # R2 stands on its own (the site's pipeline D12): beside the Pages deploy,
  # not after it, and neither side's failure stops the other.
  publish-r2:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the publish script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          path: code
          sparse-checkout: pipeline
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages
      - name: Test the publish script
        run: python3 code/pipeline/test_publish_r2.py
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          mkdir site
          tar -xf pages/artifact.tar -C site
          python3 code/pipeline/publish_r2.py site "$GITHUB_REPOSITORY"
