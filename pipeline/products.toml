# What this repository publishes: CBEFS physical fields — surface and bottom temperature and salinity, and water level, from VIMS's Chesapeake Bay
# Environmental Forecast System (CBEFS), read by OPeNDAP from tds.vims.edu —
# published, not drawn on the website's map (the owner, 2026-09-27). Cite
# CBEFS and the Virginia Institute of Marine Science wherever it is shown:
# the data's license asks exactly that, and every header's `source` says it.
#
# The fetcher is the site's `scripts/fetch-cbefs.py`, shared by the three
# CBEFS repositories: this step is scoped with `--only=` to this repository's
# products, or the write fence refuses the run.
#
# - **Every `roots` entry must be one the site's `test-schema.mjs --roots`
#   publishes**, or the orchestrator exits 2.
# - **Paths are relative to the site checkout**: `scripts/...`.
# - **One regional grid per root at 0.007 degree**, `regional: true`, no
#   tiles; about 0.8 MB a field (1.4 MB for the currents), measured
#   2026-09-27. A bottom root's header carries no depth: the deepest level is
#   a different depth in every cell, and the root's name says bottom.
#
# **The budget.** Each run publishes the daily mean stamped noon UTC on
# today's date, so the frame is at most twelve hours from the reader, plus
# the six hours to the next run and GitHub's lateness. 20 hours; re-measure
# after a week. The run posted about 12:20 UTC covers the day before its date
# and four after, so when VIMS stops posting the frames carry on for days —
# `modelRun` in each header is what says how old the forecast is.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# Named after the server all three CBEFS repositories read.
[steps.cbefs]
cmd = ["python3", "scripts/fetch-cbefs.py", "--only=sst-cbefs,sss-cbefs,ssh-cbefs,bottomt-cbefs,bottoms-cbefs,bottomdepth-cbefs,temp-cbefs,sal-cbefs"]
lane = "vims-thredds"

[products.sst-cbefs]
title = "CBEFS surface temperature"
step = "cbefs"
roots = ["sst-cbefs.json"]
writes = ["sst-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=sst-cbefs"]

[products.sss-cbefs]
title = "CBEFS surface salinity"
step = "cbefs"
roots = ["sss-cbefs.json"]
writes = ["sss-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=sss-cbefs"]

[products.ssh-cbefs]
title = "CBEFS water level"
step = "cbefs"
roots = ["ssh-cbefs.json"]
writes = ["ssh-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=ssh-cbefs"]

[products.bottomt-cbefs]
title = "CBEFS bottom temperature"
step = "cbefs"
roots = ["bottomt-cbefs.json"]
writes = ["bottomt-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=bottomt-cbefs"]

[products.bottoms-cbefs]
title = "CBEFS bottom salinity"
step = "cbefs"
roots = ["bottoms-cbefs.json"]
writes = ["bottoms-cbefs.json"]
max_age_hours = 20
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=bottoms-cbefs"]

# **R2's alone** (2026-10-09, the site pipeline's D13 note): `r2_only` leaves it out of
# the Pages site and Pages' status; the R2 job publishes it beside the rest.
[products.bottomdepth-cbefs]
title = "CBEFS depth of the bottom level"
step = "cbefs"
roots = ["bottomdepth-cbefs.json"]
writes = ["bottomdepth-cbefs.json"]
max_age_hours = 20
r2_only = true
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=bottomdepth-cbefs"]

# **Temperature at fixed depths, R2's alone** (2026-10-10; the site's fetcher, LEVELS): the model's
# own levels interpolated to the first 17 of Mercator's depths, every one its
# water reaches, one root a depth named for it to the meter, below the datum as
# the model's own fixed slices are -- written by the same step as the rest.
[products.temp-cbefs]
title = "CBEFS temperature at Mercator's depths"
step = "cbefs"
roots = ["temp-cbefs-0m.json", "temp-cbefs-2m.json", "temp-cbefs-3m.json", "temp-cbefs-4m.json",
         "temp-cbefs-5m.json", "temp-cbefs-6m.json", "temp-cbefs-8m.json", "temp-cbefs-10m.json",
         "temp-cbefs-11m.json", "temp-cbefs-13m.json", "temp-cbefs-16m.json", "temp-cbefs-18m.json",
         "temp-cbefs-22m.json", "temp-cbefs-25m.json", "temp-cbefs-29m.json", "temp-cbefs-34m.json",
         "temp-cbefs-40m.json"]
writes = ["temp-cbefs-*m.json"]
max_age_hours = 30
r2_only = true
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=temp-cbefs"]

# **Salinity at fixed depths, R2's alone** (2026-10-10; the site's fetcher, LEVELS): the model's
# own levels interpolated to the first 17 of Mercator's depths, every one its
# water reaches, one root a depth named for it to the meter, below the datum as
# the model's own fixed slices are -- written by the same step as the rest.
[products.sal-cbefs]
title = "CBEFS salinity at Mercator's depths"
step = "cbefs"
roots = ["sal-cbefs-0m.json", "sal-cbefs-2m.json", "sal-cbefs-3m.json", "sal-cbefs-4m.json",
         "sal-cbefs-5m.json", "sal-cbefs-6m.json", "sal-cbefs-8m.json", "sal-cbefs-10m.json",
         "sal-cbefs-11m.json", "sal-cbefs-13m.json", "sal-cbefs-16m.json", "sal-cbefs-18m.json",
         "sal-cbefs-22m.json", "sal-cbefs-25m.json", "sal-cbefs-29m.json", "sal-cbefs-34m.json",
         "sal-cbefs-40m.json"]
writes = ["sal-cbefs-*m.json"]
max_age_hours = 30
r2_only = true
namespace = ["python3", "scripts/fetch-cbefs.py", "--namespace", "--only=sal-cbefs"]
